spring.application.name=conteudos-cache

spring.datasource.url=jdbc:h2:mem:conteudos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

app.cache.max-itens=5
app.cache.ttl-segundos=60

app.fonte.atraso-ms=2000

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{0} : %msg%n
